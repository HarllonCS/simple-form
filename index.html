<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <title>Simple Form</title>
</head>
<body>
    <h1>Form exercise</h1>

    <form action="./process.html" method="GET">
        <fieldset> <!-- personal data -->
            <legend>Personal data</legend>

            <label for="idName">Name:</label><br>
            <!-- name -->
            <input type="text" name="name" id="idName"><br>
            
            <label for="idEmail">Email:</label><br>
            <!-- e-mail -->
            <input type="email" name="email" id="idEmail"><br>
            
            <input type="checkbox" id="idCheck" name="receive-email" value="on">
            <label for="idCheck">I want to receive e-mail</label><br><br>

            <label for="idPass">Password:</label><br>
            <!-- password -->
            <input type="password" name="password" id="idPass">
        </fieldset> <!-- personal data /end -->

        <fieldset> <!-- additional info -->
            <legend>Additional information</legend>

            <input type="radio" name="type" id="idPf" value="cpf" checked>
            <label for="idCpf">Individual</label>

            <input type="radio" name="type" id="idPj" value="pj">
            <label for="idPj">Legal entity</label>
        </fieldset><br> <!-- additional info /end -->

        <button type="submit">Submit</button>
    </form>
</body>
</html>
